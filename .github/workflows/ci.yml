name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1 -race -coverprofile=cover.out
      - run: go tool cover -func=cover.out | tail -1
      - run: ./scripts/gate-scenarios-bound.sh
      - run: ./scripts/gate-no-wildcard.sh
      - run: ./scripts/gates-have-teeth.sh
      - run: python3 scripts/mutate.py
  # The daemon under its own filter, on the two architectures it goes on for: the real serve in a
  # static binary, through TLS, a backend by name, a stream and the journal's rotation; then copies
  # of the tree whose list lacks one call must die with SIGSYS. Both runner types are free for a
  # public repository.
  seccomp:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./scripts/gate-seccomp-run.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm64, goarm: "", apk: aarch64_cortex-a53 }
          - { goarch: arm, goarm: "7", apk: arm_cortex-a7_neon-vfpv4 }
          - { goarch: amd64, goarm: "", apk: x86_64 }
          - { goarch: mipsle, goarm: "", apk: mipsel_24kc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w -X main.version=0.1.0" -o llm-gateway.${{ matrix.goarch }} .
          ls -l llm-gateway.${{ matrix.goarch }}
      - name: package
        run: ./mkapk.sh llm-gateway.${{ matrix.goarch }} 0.1.0 ${{ matrix.apk }}
      # The git tree the package was built from, which scripts/build-feed.sh requires to be the
      # tree it signs from: a pull request builds a merge commit, not its head.
      - run: git rev-parse 'HEAD^{tree}' > source-tree
      - uses: actions/upload-artifact@v7
        with:
          name: llm-gateway-${{ matrix.apk }}
          path: |
            llm-gateway-*.apk
            source-tree
