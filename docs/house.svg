<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-label="The house: laptops and phones on the LAN reach llm-gateway on the router at https://llm.lan:8760 with a key each, Hermes on the router uses 127.0.0.1:8761, and the machines that run the models sit in the zone models, which only the router reaches. Guest Wi-Fi, the internet and a LAN device going directly do not reach them.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b63"/></marker>
</defs>
<rect width="1280" height="690" fill="url(#bg)"/><rect width="1280" height="690" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>
<style>.s{font-family:ui-sans-serif, -apple-system, Segoe UI, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}.flow{stroke-dasharray:7 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.x{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.flow,.x{animation:none}}</style>
<text class="s" x="48" y="58" font-size="26" fill="#e6edf3" font-weight="600">One name for every model in the house</text>
<text class="s" x="48" y="86" font-size="14" fill="#69788b">Each device reaches the models through the router, with a key of its own. The model machines sit in a zone only the router reaches.</text>
<rect x="48" y="124" width="300" height="306" rx="12" fill="#0f1520" stroke="#283341" stroke-dasharray="6 5"/>
<rect x="64" y="112" width="92" height="24" rx="12" fill="#141a23" stroke="#2dd4bf"/>
<text class="m" x="110.0" y="128" font-size="12" fill="#2dd4bf" text-anchor="middle">zone lan</text>
<g filter="url(#soft)"><rect x="68" y="152" width="260" height="112" rx="8" fill="#1b2331" stroke="#283341"/><rect x="68" y="152" width="6" height="112" rx="3" fill="#2dd4bf"/></g>
<text class="s" x="88" y="182" font-size="17" fill="#e6edf3" font-weight="600">Laptop</text>
<text class="m" x="88" y="210" font-size="13" fill="#9aa7b8">https://llm.lan:8760/v1</text>
<text class="m" x="88" y="232" font-size="13" fill="#9aa7b8">a key of its own</text>
<text class="m" x="88" y="254" font-size="13" fill="#69788b">trusts the house CA once</text>
<g filter="url(#soft)"><rect x="68" y="288" width="260" height="122" rx="8" fill="#1b2331" stroke="#283341"/><rect x="68" y="288" width="6" height="122" rx="3" fill="#2dd4bf"/></g>
<text class="s" x="88" y="318" font-size="17" fill="#e6edf3" font-weight="600">Phone</text>
<text class="m" x="88" y="346" font-size="13" fill="#9aa7b8">the same URL, its own key</text>
<text class="m" x="88" y="368" font-size="13" fill="#9aa7b8">sees only its models</text>
<text class="m" x="88" y="392" font-size="13" fill="#69788b">lost? remove its key</text>
<g filter="url(#soft)"><rect x="440" y="124" width="400" height="306" rx="10" fill="#1b2331" stroke="#283341"/><rect x="440" y="124" width="6" height="306" rx="3" fill="#4493f8"/></g>
<text class="s" x="464" y="162" font-size="19" fill="#e6edf3" font-weight="600">OpenWrt router</text>
<rect x="712" y="144" width="112" height="24" rx="12" fill="#141a23" stroke="#4493f8"/>
<text class="m" x="768.0" y="160" font-size="12" fill="#4493f8" text-anchor="middle">llm-gateway</text>
<text class="m" x="464" y="196" font-size="13" fill="#e6edf3">:8760 only in the zones you name</text>
<text class="m" x="464" y="218" font-size="13" fill="#9aa7b8">HTTPS under the router's own CA</text>
<text class="m" x="464" y="240" font-size="13" fill="#9aa7b8">a key per device, stored as SHA-256</text>
<text class="m" x="464" y="262" font-size="13" fill="#9aa7b8">each device sees only its models</text>
<text class="m" x="464" y="284" font-size="13" fill="#9aa7b8">Host, Origin and limits checked</text>
<text class="m" x="464" y="306" font-size="13" fill="#69788b">journal: who, which model, no text</text>
<rect x="464" y="330" width="352" height="86" rx="8" fill="#141a23" stroke="#3fb950"/>
<text class="s" x="484" y="357" font-size="15" fill="#e6edf3" font-weight="600">Hermes agent, on the router</text>
<text class="m" x="484" y="381" font-size="12" fill="#9aa7b8">http://127.0.0.1:8761/v1</text>
<text class="m" x="484" y="401" font-size="12" fill="#69788b">a key too: hermes.main.llm_gateway</text>
<rect x="932" y="124" width="300" height="476" rx="12" fill="#0f1520" stroke="#2dd4bf" stroke-dasharray="6 5"/>
<rect x="948" y="112" width="112" height="24" rx="12" fill="#141a23" stroke="#2dd4bf"/>
<text class="m" x="1004.0" y="128" font-size="12" fill="#2dd4bf" text-anchor="middle">zone models</text>
<g filter="url(#soft)"><rect x="952" y="152" width="260" height="104" rx="8" fill="#1b2331" stroke="#283341"/><rect x="952" y="152" width="6" height="104" rx="3" fill="#3fb950"/></g>
<text class="s" x="972" y="182" font-size="17" fill="#e6edf3" font-weight="600">Desktop</text>
<text class="m" x="972" y="210" font-size="13" fill="#9aa7b8">Ollama, port 11434</text>
<text class="m" x="972" y="234" font-size="13" fill="#69788b">10.60.0.10</text>
<g filter="url(#soft)"><rect x="952" y="276" width="260" height="104" rx="8" fill="#1b2331" stroke="#283341"/><rect x="952" y="276" width="6" height="104" rx="3" fill="#3fb950"/></g>
<text class="s" x="972" y="306" font-size="17" fill="#e6edf3" font-weight="600">Mini PC</text>
<text class="m" x="972" y="334" font-size="13" fill="#9aa7b8">llama-server, port 8080</text>
<text class="m" x="972" y="358" font-size="13" fill="#69788b">10.60.0.11</text>
<text class="m" x="952" y="412" font-size="12" fill="#9aa7b8">only the router reaches it</text>
<text class="m" x="952" y="432" font-size="12" fill="#9aa7b8">no internet unless you ask:</text>
<text class="m" x="952" y="452" font-size="12" fill="#69788b">models-zone models -internet</text>
<line class="flow" x1="330" y1="208" x2="436" y2="208" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<text class="m" x="394" y="198" font-size="11" fill="#3fb950" text-anchor="middle">HTTPS + key</text>
<line class="flow" x1="330" y1="346" x2="436" y2="346" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<text class="m" x="394" y="336" font-size="11" fill="#3fb950" text-anchor="middle">HTTPS + key</text>
<line class="flow" x1="842" y1="204" x2="948" y2="204" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<text class="m" x="886" y="194" font-size="11" fill="#3fb950" text-anchor="middle">in the house</text>
<line class="flow" x1="842" y1="328" x2="948" y2="328" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<text class="m" x="886" y="318" font-size="11" fill="#3fb950" text-anchor="middle">only way in</text>
<rect x="48" y="477" width="230" height="30" rx="15" fill="#141a23" stroke="#ff6b63"/>
<text class="s" x="163" y="497" font-size="14" fill="#e6edf3" text-anchor="middle">Guest Wi-Fi</text>
<line x1="282" y1="492" x2="926" y2="492" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowR)" opacity="0.75"/>
<text class="m" x="590" y="483" font-size="12" fill="#ff6b63" text-anchor="middle">no forwarding guest to models; :8760 is closed there</text>
<g class="x" stroke="#ff6b63" stroke-width="3.5" stroke-linecap="round"><line x1="892" y1="482" x2="912" y2="502"/><line x1="912" y1="482" x2="892" y2="502"/></g>
<rect x="48" y="523" width="230" height="30" rx="15" fill="#141a23" stroke="#ff6b63"/>
<text class="s" x="163" y="543" font-size="14" fill="#e6edf3" text-anchor="middle">The internet (wan)</text>
<line x1="282" y1="538" x2="926" y2="538" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowR)" opacity="0.75"/>
<text class="m" x="590" y="529" font-size="12" fill="#ff6b63" text-anchor="middle">no forwarding from wan; nothing listens on wan</text>
<g class="x" stroke="#ff6b63" stroke-width="3.5" stroke-linecap="round"><line x1="892" y1="528" x2="912" y2="548"/><line x1="912" y1="528" x2="892" y2="548"/></g>
<rect x="48" y="569" width="230" height="30" rx="15" fill="#141a23" stroke="#ff6b63"/>
<text class="s" x="163" y="589" font-size="14" fill="#e6edf3" text-anchor="middle">A LAN device, directly</text>
<line x1="282" y1="584" x2="926" y2="584" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowR)" opacity="0.75"/>
<text class="m" x="590" y="575" font-size="12" fill="#ff6b63" text-anchor="middle">no forwarding lan to models: only through the gateway</text>
<g class="x" stroke="#ff6b63" stroke-width="3.5" stroke-linecap="round"><line x1="892" y1="574" x2="912" y2="594"/><line x1="912" y1="574" x2="892" y2="594"/></g>
<text class="m" x="48" y="640" font-size="12" fill="#69788b">Run on OpenWrt 25.12 in a virtual lab: lan_cannot_reach_the_model_box, lan_reaches_the_model_through_the_gateway,</text>
<text class="m" x="48" y="658" font-size="12" fill="#69788b">models_zone_has_no_internet, guest_cannot_reach_the_port (scripts/vlab-e2e.sh, docs/evidence/)</text>
<text class="m" x="1256" y="674" font-size="12" fill="#69788b" text-anchor="end">github.com/TAIPANBOX/openwrt-llm-gateway</text>
</svg>
