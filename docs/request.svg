<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="One request through llm-gateway, check by check in the order of gateway.go: the Host (421 if foreign), the key (401), the web page's Origin (403), the model (403), the client's limits (429), and only then the model server, whose answer is streamed back (200).">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b63"/></marker>
</defs>
<rect width="1280" height="560" fill="url(#bg)"/><rect width="1280" height="560" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>
<style>.s{font-family:ui-sans-serif, -apple-system, Segoe UI, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}@keyframes go{0%,10.83%{transform:translateX(0);opacity:1}17.50%,23.33%{transform:translateX(200px);opacity:1}30.00%,35.83%{transform:translateX(400px);opacity:1}42.50%,48.33%{transform:translateX(600px);opacity:1}55.00%,60.83%{transform:translateX(800px);opacity:1}67.50%,87.50%{transform:translateX(1000px);opacity:1}95.00%{transform:translateX(1000px);opacity:0}95.42%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}.pill{animation:go 12s ease-in-out -9.5s infinite}@keyframes on0{0%,5.00%{opacity:.3}7.50%,91.67%{opacity:1}96.67%,100%{opacity:.3}}.b0{animation:on0 12s ease-in-out -9.5s infinite}@keyframes no0{0%,5.00%{opacity:.45}7.50%,15.00%{opacity:1}17.50%,100%{opacity:.45}}.r0{animation:no0 12s ease-in-out -9.5s infinite}@keyframes on1{0%,17.50%{opacity:.3}20.00%,91.67%{opacity:1}96.67%,100%{opacity:.3}}.b1{animation:on1 12s ease-in-out -9.5s infinite}@keyframes no1{0%,17.50%{opacity:.45}20.00%,27.50%{opacity:1}30.00%,100%{opacity:.45}}.r1{animation:no1 12s ease-in-out -9.5s infinite}@keyframes on2{0%,30.00%{opacity:.3}32.50%,91.67%{opacity:1}96.67%,100%{opacity:.3}}.b2{animation:on2 12s ease-in-out -9.5s infinite}@keyframes no2{0%,30.00%{opacity:.45}32.50%,40.00%{opacity:1}42.50%,100%{opacity:.45}}.r2{animation:no2 12s ease-in-out -9.5s infinite}@keyframes on3{0%,42.50%{opacity:.3}45.00%,91.67%{opacity:1}96.67%,100%{opacity:.3}}.b3{animation:on3 12s ease-in-out -9.5s infinite}@keyframes no3{0%,42.50%{opacity:.45}45.00%,52.50%{opacity:1}55.00%,100%{opacity:.45}}.r3{animation:no3 12s ease-in-out -9.5s infinite}@keyframes on4{0%,55.00%{opacity:.3}57.50%,91.67%{opacity:1}96.67%,100%{opacity:.3}}.b4{animation:on4 12s ease-in-out -9.5s infinite}@keyframes no4{0%,55.00%{opacity:.45}57.50%,65.00%{opacity:1}67.50%,100%{opacity:.45}}.r4{animation:no4 12s ease-in-out -9.5s infinite}@keyframes on5{0%,67.50%{opacity:.3}70.00%,91.67%{opacity:1}96.67%,100%{opacity:.3}}.b5{animation:on5 12s ease-in-out -9.5s infinite}.r5{animation:on5 12s ease-in-out -9.5s infinite}@media (prefers-reduced-motion:reduce){.pill,.b0,.r0,.b1,.r1,.b2,.r2,.b3,.r3,.b4,.r4,.b5,.r5{animation:none}}</style>
<text class="s" x="48" y="58" font-size="26" fill="#e6edf3" font-weight="600">One request, six checks, in this order</text>
<text class="s" x="48" y="86" font-size="14" fill="#69788b">The first check that fails answers, and nothing reaches a model server until every one has passed. The order is the code's.</text>
<g class="pill"><rect x="48" y="104" width="176" height="28" rx="14" fill="#141a23" stroke="#2dd4bf"/><text class="m" x="136" y="123" font-size="12" fill="#2dd4bf" text-anchor="middle">the request</text>
</g>
<g class="b0"><rect x="48" y="150" width="176" height="176" rx="10" fill="#0f1520" stroke="#e3b341"/>
<circle cx="76" cy="182" r="14" fill="none" stroke="#e3b341" stroke-width="2"/>
<text class="s" x="76" y="187" font-size="13" fill="#e3b341" font-weight="600" text-anchor="middle">1</text>
<text class="s" x="100" y="188" font-size="16" fill="#e6edf3" font-weight="600">Host</text>
<text class="m" x="64" y="226" font-size="12" fill="#9aa7b8">llm.lan, or an</text>
<text class="m" x="64" y="246" font-size="12" fill="#9aa7b8">address it listens</text>
<text class="m" x="64" y="266" font-size="12" fill="#9aa7b8">on; any other name</text>
<text class="m" x="64" y="286" font-size="12" fill="#9aa7b8">is DNS rebinding</text>
</g>
<line x1="227" y1="238" x2="245" y2="238" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<g class="r0"><line x1="136" y1="328" x2="136" y2="352" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
<rect x="48" y="356" width="176" height="34" rx="17" fill="#141a23" stroke="#ff6b63"/>
<text class="m" x="136" y="378" font-size="14" fill="#ff6b63" font-weight="600" text-anchor="middle">421 wrong host</text>
</g>
<g class="b1"><rect x="248" y="150" width="176" height="176" rx="10" fill="#0f1520" stroke="#4493f8"/>
<circle cx="276" cy="182" r="14" fill="none" stroke="#4493f8" stroke-width="2"/>
<text class="s" x="276" y="187" font-size="13" fill="#4493f8" font-weight="600" text-anchor="middle">2</text>
<text class="s" x="300" y="188" font-size="16" fill="#e6edf3" font-weight="600">Key</text>
<text class="m" x="264" y="226" font-size="12" fill="#9aa7b8">a Bearer key whose</text>
<text class="m" x="264" y="246" font-size="12" fill="#9aa7b8">SHA-256 is one</text>
<text class="m" x="264" y="266" font-size="12" fill="#9aa7b8">client's; loopback</text>
<text class="m" x="264" y="286" font-size="12" fill="#9aa7b8">needs one too</text>
</g>
<line x1="427" y1="238" x2="445" y2="238" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<g class="r1"><line x1="336" y1="328" x2="336" y2="352" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
<rect x="248" y="356" width="176" height="34" rx="17" fill="#141a23" stroke="#ff6b63"/>
<text class="m" x="336" y="378" font-size="14" fill="#ff6b63" font-weight="600" text-anchor="middle">401 no valid key</text>
</g>
<g class="b2"><rect x="448" y="150" width="176" height="176" rx="10" fill="#0f1520" stroke="#4493f8"/>
<circle cx="476" cy="182" r="14" fill="none" stroke="#4493f8" stroke-width="2"/>
<text class="s" x="476" y="187" font-size="13" fill="#4493f8" font-weight="600" text-anchor="middle">3</text>
<text class="s" x="500" y="188" font-size="16" fill="#e6edf3" font-weight="600">Origin</text>
<text class="m" x="464" y="226" font-size="12" fill="#9aa7b8">no Origin header:</text>
<text class="m" x="464" y="246" font-size="12" fill="#9aa7b8">an app, passes;</text>
<text class="m" x="464" y="266" font-size="12" fill="#9aa7b8">a web page only if</text>
<text class="m" x="464" y="286" font-size="12" fill="#9aa7b8">the client lists it</text>
</g>
<line x1="627" y1="238" x2="645" y2="238" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<g class="r2"><line x1="536" y1="328" x2="536" y2="352" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
<rect x="448" y="356" width="176" height="34" rx="17" fill="#141a23" stroke="#ff6b63"/>
<text class="m" x="536" y="378" font-size="14" fill="#ff6b63" font-weight="600" text-anchor="middle">403 origin</text>
</g>
<g class="b3"><rect x="648" y="150" width="176" height="176" rx="10" fill="#0f1520" stroke="#2dd4bf"/>
<circle cx="676" cy="182" r="14" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<text class="s" x="676" y="187" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="middle">4</text>
<text class="s" x="700" y="188" font-size="16" fill="#e6edf3" font-weight="600">Model</text>
<text class="m" x="664" y="226" font-size="12" fill="#9aa7b8">only the models</text>
<text class="m" x="664" y="246" font-size="12" fill="#9aa7b8">the client is</text>
<text class="m" x="664" y="266" font-size="12" fill="#9aa7b8">given; the same 403</text>
<text class="m" x="664" y="286" font-size="12" fill="#9aa7b8">for one nobody has</text>
</g>
<line x1="827" y1="238" x2="845" y2="238" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<g class="r3"><line x1="736" y1="328" x2="736" y2="352" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
<rect x="648" y="356" width="176" height="34" rx="17" fill="#141a23" stroke="#ff6b63"/>
<text class="m" x="736" y="378" font-size="14" fill="#ff6b63" font-weight="600" text-anchor="middle">403 model</text>
</g>
<g class="b4"><rect x="848" y="150" width="176" height="176" rx="10" fill="#0f1520" stroke="#2dd4bf"/>
<circle cx="876" cy="182" r="14" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<text class="s" x="876" y="187" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="middle">5</text>
<text class="s" x="900" y="188" font-size="16" fill="#e6edf3" font-weight="600">Limits</text>
<text class="m" x="864" y="226" font-size="12" fill="#9aa7b8">requests a minute</text>
<text class="m" x="864" y="246" font-size="12" fill="#9aa7b8">and in flight,</text>
<text class="m" x="864" y="266" font-size="12" fill="#9aa7b8">per client</text>
</g>
<line x1="1027" y1="238" x2="1045" y2="238" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<g class="r4"><line x1="936" y1="328" x2="936" y2="352" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
<rect x="848" y="356" width="176" height="34" rx="17" fill="#141a23" stroke="#ff6b63"/>
<text class="m" x="936" y="378" font-size="14" fill="#ff6b63" font-weight="600" text-anchor="middle">429 too many</text>
</g>
<g class="b5"><rect x="1048" y="150" width="176" height="176" rx="10" fill="#0f1520" stroke="#3fb950"/>
<circle cx="1076" cy="182" r="14" fill="none" stroke="#3fb950" stroke-width="2"/>
<text class="s" x="1076" y="187" font-size="13" fill="#3fb950" font-weight="600" text-anchor="middle">6</text>
<text class="s" x="1100" y="188" font-size="16" fill="#e6edf3" font-weight="600">Server</text>
<text class="m" x="1064" y="226" font-size="12" fill="#9aa7b8">dialled only inside</text>
<text class="m" x="1064" y="246" font-size="12" fill="#9aa7b8">the house; gets the</text>
<text class="m" x="1064" y="266" font-size="12" fill="#9aa7b8">server's key, not</text>
<text class="m" x="1064" y="286" font-size="12" fill="#9aa7b8">the client's</text>
</g>
<g class="r5"><line x1="1136" y1="328" x2="1136" y2="352" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowG)"/>
<rect x="1048" y="356" width="176" height="34" rx="17" fill="#141a23" stroke="#3fb950"/>
<text class="m" x="1136" y="378" font-size="14" fill="#3fb950" font-weight="600" text-anchor="middle">200 streamed</text>
<text class="m" x="1136" y="412" font-size="12" fill="#69788b" text-anchor="middle">502 if no answer</text>
</g>
<text class="s" x="48" y="456" font-size="14" fill="#9aa7b8">Before the key: an unknown route is 404, a wrong method 405. A browser's preflight is answered from the origin lists alone: 204 or 403.</text>
<text class="s" x="48" y="480" font-size="14" fill="#9aa7b8">After the origin: a body over 16 MB is 413, a body naming no model 400. A server that resolves outside the house is refused: 502.</text>
<text class="s" x="48" y="504" font-size="14" fill="#9aa7b8">/health answers without a key. Every other request, refused or served, is one journal line: no prompt, no answer, no key.</text>
<text class="m" x="1256" y="544" font-size="12" fill="#69788b" text-anchor="end">github.com/TAIPANBOX/openwrt-llm-gateway</text>
</svg>
